name: ecommerce-app

services:
  ecommerce-mysql:
    container_name: ecommerce-mysql
    image: mysql:8.0.35
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --character-set-client-handshake=FALSE
    ports:
      - 3306:3306
    volumes:
      - ecommerce-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u${DB_USER}', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-network

  ecommerce-backend:
    container_name: ecommerce-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ecommerce-mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      DB_HOST: ecommerce-mysql
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      JWT_PASSWORD_RECOVERY_SECRET_KEY: ${JWT_PASSWORD_RECOVERY_SECRET_KEY}
      JWT_PASSWORD_RECOVERY_EXPIRES_IN: ${JWT_PASSWORD_RECOVERY_EXPIRES_IN}
      SALT_ROUNDS: ${SALT_ROUNDS}
    ports:
      - 3000:3000
    networks:
      - ecommerce-network

volumes:
  ecommerce-data:

networks:
  ecommerce-network:
    driver: bridge
